spring.application.name=extblocker

# Render (and similar PaaS hosts) inject PORT and route traffic to it; default 8080 keeps local/Docker unchanged.
server.port=${PORT:8080}

# H2 in-memory DB: lives for the app's lifetime (DB_CLOSE_DELAY=-1),
# reset to a clean seeded state on every restart.
spring.datasource.url=jdbc:h2:mem:extblocker;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Schema/seed data come from schema.sql / data.sql, not Hibernate auto-ddl.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.sql.init.mode=always

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Local disk storage for uploaded files, outside src/main/resources/static so
# nothing under it is ever served back by Spring's static resource handler.
app.upload.dir=uploads-data

# Upload size limits (PRD 8.4): no business requirement was given, so this replaces
# Spring Boot's implicit 1MB/10MB defaults with an explicit, documented ceiling.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
